[project]
name = "resume-rag"
version = "0.1.0"
description = "RAG system for generating ATS-friendly resumes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.21.0",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "sentence-transformers>=6.0.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers>=5.12.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true